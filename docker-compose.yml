services:
  postgres:
    image: postgres:16-alpine
    container_name: familyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: familyhub
    ports:
      - "5432:5432"
    volumes:
      - familyhub-pgdata:/var/lib/postgresql/data

volumes:
  familyhub-pgdata:
